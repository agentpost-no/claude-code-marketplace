name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default.
permissions:
  contents: read

jobs:
  plugin:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: plugins/agentpost
      - run: bunx typescript@5.9.3 --noEmit -p tsconfig.json
        working-directory: plugins/agentpost
      - run: bun test
        working-directory: plugins/agentpost
      - run: bun run build
        working-directory: plugins/agentpost
      # dist/ is committed and is what .mcp.json actually executes, so a commit touching
      # only the bundle would ship to every plugin user without being reviewable in a diff.
      # Rebuilding and comparing makes the tracked bundle provably the tracked source.
      #
      # This needs a pinned bun (above, not `latest`): the bundler renames variables
      # differently between versions, so an unpinned toolchain fails this check on
      # identical source. Bumping bun means rebuilding and committing dist in the same
      # commit.
      - name: Verify committed dist matches source
        run: |
          if ! git diff --exit-code -- plugins/agentpost/dist; then
            echo "::error::plugins/agentpost/dist does not match a build of the current source. Run 'bun run build' in plugins/agentpost and commit the result."
            exit 1
          fi

  openclaw:
    name: OpenClaw plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      # The bundle inlines the shared core from plugins/agentpost, and module resolution
      # for that source starts there, not in this package.
      - run: bun install --frozen-lockfile
        working-directory: plugins/agentpost
      # Full install here, openclaw devDependency included: this is the job that proves
      # the plugin still matches the SDK contract it is compiled against.
      - run: bun install --frozen-lockfile
        working-directory: packages/openclaw
      - run: bunx typescript@5.9.3 --noEmit -p tsconfig.json
        working-directory: packages/openclaw
      - run: bun test
        working-directory: packages/openclaw
      - run: bun run build
        working-directory: packages/openclaw
      - name: Load the built plugin
        working-directory: packages/openclaw
        # Catches what typecheck cannot: a bundle the host refuses to evaluate, such as
        # a top-level await that is illegal once the loader wraps the module.
        run: |
          node --input-type=module -e "
            const entry = (await import('./dist/index.mjs')).default;
            if (entry.id !== 'agentpost') throw new Error('unexpected plugin id: ' + entry.id);
            if (typeof entry.channelPlugin?.gateway?.startAccount !== 'function') {
              throw new Error('channel is missing its gateway adapter');
            }
            if (typeof entry.channelPlugin?.outbound?.sendText !== 'function') {
              throw new Error('channel is missing its outbound adapter');
            }
            if (!entry.channelPlugin?.message) throw new Error('channel is missing its message adapter');
            console.log('plugin loads and registers:', entry.id);
          "
