name: Publish OpenClaw plugin

# Publishing happens here, never from a laptop: the registry credential lives only in
# this repository, and every published tarball is traceable to a commit and a run.
#
# Release flow: bump the version in packages/openclaw-agentpost/package.json, merge,
# then push a tag `openclaw-agentpost-v<version>`. The tag and the manifest version must
# agree or the run fails before anything is published.
#
# Two outputs, because OpenClaw cannot install a plugin from git - its installer rejects
# URLs, git refs and protocol specs, accepting only npm specs, local paths and archives:
#
#   1. A GitHub Release carrying the built tarball. Works with no npm account:
#      download it, then `openclaw plugins install ./<file>.tgz`.
#   2. An npm publish, when an NPM_TOKEN secret exists. Until then the release step
#      still runs, so a tag is useful immediately.

on:
  push:
    tags: ["openclaw-agentpost-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and inspect only, do not publish"
        type: boolean
        default: true

defaults:
  run:
    working-directory: packages/openclaw-agentpost

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      # Needed to attach the tarball to a release.
      contents: write
      # Required for npm provenance: the run signs the tarball with its own identity.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # OpenClaw's own floor, and the runtime the plugin is built for.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Only what the bundle inlines. Those imports live in plugins/agentpost and resolve
      # from there; nothing in this package's own node_modules is needed to build, and
      # the openclaw devDependency is a ~200MB download the bundle marks external anyway.
      - name: Install build dependencies
        run: bun install --frozen-lockfile
        working-directory: plugins/agentpost

      - name: Build bundle
        run: bun run build

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#openclaw-agentpost-v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg_version" >&2
            exit 1
          fi
          manifest_version="$(node -p "require('./openclaw.plugin.json').version")"
          if [ "$manifest_version" != "$pkg_version" ]; then
            echo "openclaw.plugin.json version $manifest_version does not match package version $pkg_version" >&2
            exit 1
          fi

      # A published tarball is permanent, so show exactly what is in it first.
      - name: Build tarball
        id: pack
        run: |
          npm pack --ignore-scripts
          file="$(ls -1 *.tgz | head -n1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Contents of $file:"
          tar tzf "$file"

      - name: Attach tarball to a release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.file }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Install with: openclaw plugins install ./$TARBALL --accept-capabilities" \
            || gh release upload "$GITHUB_REF_NAME" "$TARBALL" --repo "$GITHUB_REPOSITORY" --clobber

      # Publishing is skipped, not failed, while no npm credential exists: the release
      # above is already a usable distribution channel.
      - name: Check for npm credentials
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set; skipping the npm publish."
          fi

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true && steps.npm.outputs.available == 'true'
        # --ignore-scripts: the bundle is already built above, and prepare would rebuild
        # it without the dev toolchain. --provenance links the tarball to this run.
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
